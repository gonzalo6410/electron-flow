<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Flow</title>
<style>
  :root { --ink: #111; --mute: #777; --rule: #e6e6e6; --font: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: #fff; }
  body { display: flex; }
  #panel { width: 290px; min-width: 290px; padding: 18px 20px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid var(--rule); font-size: 13px; line-height: 1.4; }
  #view { flex: 1; position: relative; }
  canvas { display: block; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin: 0 0 14px 0; }
  h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); margin: 22px 0 6px 0; }
  select { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; }
  .smiles { margin-top: 8px; }
  .smiles input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; color: var(--ink); border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; }
  .smiles input:focus { outline: none; border-color: var(--ink); }
  #error { color: #a33; font-size: 12px; margin-top: 4px; min-height: 0; }
  .seg { display: flex; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; font-size: 12px; color: var(--ink); background: #fff; border: 0; padding: 6px 4px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #ccc; }
  .seg button.on { background: var(--ink); color: #fff; }
  .steps { width: 92px; margin-top: 8px; }
  .steps button { padding: 3px 0; font-size: 14px; }
  #status { margin-top: 12px; color: var(--mute); }
  #status b { color: var(--ink); font-weight: 500; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { font-weight: 500; color: var(--mute); text-align: right; padding: 0 0 4px 8px; font-size: 11px; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td { padding: 3px 0 3px 8px; text-align: right; border-top: 1px solid var(--rule); white-space: nowrap; }
  td.sym { color: var(--ink); }
  td.dim { color: var(--mute); }
  sub { font-size: 9px; vertical-align: -2px; }
  #rules { color: var(--mute); font-size: 11.5px; margin-top: 22px; line-height: 1.45; }
  #hint { position: absolute; left: 14px; bottom: 10px; font-size: 11px; color: #aaa; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "openchemlib": "./vendor/openchemlib.js" } }
</script>
</head>
<body>
  <div id="panel">
    <h1>Electron Flow</h1>
    <select id="case"></select>
    <form id="smiles-form" class="smiles"><input id="smiles" type="text" placeholder="or type a SMILES and press enter" spellcheck="false" autocomplete="off"></form>
    <div id="error"></div>
    <div class="seg">
      <button id="btn-cycle" class="on">one at a time</button>
      <button id="btn-avg">weighted average</button>
    </div>
    <div class="seg" style="margin-top:6px">
      <button id="btn-lewis" class="on">Lewis drawing</button>
      <button id="btn-orbital">orbitals</button>
    </div>
    <div id="steps" class="seg steps"><button id="prev" title="previous structure (left arrow)">&#8592;</button><button id="next" title="next structure (right arrow)">&#8594;</button></div>
    <div id="status"></div>
    <h2>Atoms</h2>
    <table id="atoms"></table>
    <h2>Bonds</h2>
    <table id="bonds"></table>
    <p id="rules"></p>
  </div>
  <div id="view"><div id="hint">drag to orbit · wheel to zoom · right-drag to pan</div></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
